services:
  - type: web
    name: espinal-patrullaje-360
    runtime: static
    buildCommand: echo "Static site ready"
    staticPublishPath: public
    routes:
      - type: redirect
        source: /*
        destination: https://espinal-patrullaje-seguro.onrender.com/*
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
