<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b2b"><title>Iniciar sesión · El Espinal Patrullaje</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:#053b2b;color:#123e2e;font:15px system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:32px 20px;background-image:radial-gradient(ellipse at 12% 12%,#1e795a77,transparent 55%),linear-gradient(130deg,transparent 65%,#b9da7d13 65%,#b9da7d13 66%,transparent 66%)}main{width:min(100%,420px)}.brand{text-align:center;color:#e8f2ea;margin-bottom:24px}.brand img{display:block;width:116px;height:132px;object-fit:contain;margin:0 auto 18px}.brand p{font-size:11px;font-weight:650;letter-spacing:.18em;margin:0 0 9px;color:#c5dccd}.brand h1{font-size:23px;letter-spacing:.025em;margin:0;font-weight:800}.card{background:#fff;border:1px solid #e1e9e3;border-top:4px solid #aacd51;border-radius:16px;padding:30px;box-shadow:0 18px 55px #001a2440}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#647a6a;font-weight:750;margin:0 0 8px}.card h2{font-size:24px;letter-spacing:-.025em;margin:0 0 8px}.intro{font-size:13px;line-height:1.6;color:#66786d;margin:0 0 25px}label{display:block;font-size:13px;font-weight:700;margin:18px 0 8px}.field{position:relative}input{width:100%;min-height:48px;border:1px solid #cbd8cf;border-radius:8px;padding:12px 14px;font:inherit;color:#143c2d;background:#fbfdfb;outline:none}input:focus{border-color:#34835c;box-shadow:0 0 0 3px #34835c18}input[type=password],input[name=password]{padding-right:66px}button{font:inherit;cursor:pointer}.reveal{position:absolute;right:8px;top:8px;min-height:32px;padding:4px 7px;border:0;border-radius:5px;background:transparent;color:#386749;font-size:11px;font-weight:700}.reveal:hover{background:#e9f1e8}.submit{width:100%;min-height:49px;margin-top:25px;border:1px solid #075338;border-radius:8px;background:#075338;color:white;font-size:14px;font-weight:750;box-shadow:0 3px 7px #07533818}.submit:hover{background:#0c6547}.submit:disabled{opacity:.7;cursor:wait}button:focus-visible{outline:3px solid #91ba47;outline-offset:3px}.error{font-size:13px;line-height:1.5;color:#a32a29;background:#fff1ee;border-radius:7px;padding:10px 12px;margin:18px 0 0}.error:empty{display:none}.access{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;color:#78907d;margin:19px 0 0}.access svg{width:13px;height:13px}.footer{text-align:center;font-size:11px;line-height:1.7;color:#b9cfc1;margin:22px 0 0}@media(max-width:480px){body{padding:24px 18px}.brand{margin-bottom:20px}.brand img{width:96px;height:110px;margin-bottom:14px}.brand h1{font-size:21px}.card{padding:25px 23px}.card h2{font-size:23px}}
</style><script src="/auth-assets/login.js" defer></script></head>
<body><main><div class="brand"><img src="/auth-assets/policia-nacional.png" alt="Escudo de la Policía Nacional de Colombia" width="235" height="265"><p>POLICÍA NACIONAL DE COLOMBIA</p><h1>EL ESPINAL · PATRULLAJE</h1></div>
<section class="card" aria-labelledby="login-title"><p class="eyebrow">Acceso al mapa</p><h2 id="login-title">Iniciar sesión</h2><p class="intro">Ingresa tus credenciales para acceder al mapa de patrullaje.</p>
<form action="/login" method="post" id="login-form"><input type="hidden" name="csrf" value="{{CSRF}}"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="100" placeholder="Ingresa tu usuario" required><label for="password">Contraseña</label><div class="field"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="Ingresa tu contraseña" required><button class="reveal" id="show-password" type="button" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button></div><p class="error" role="alert">{{ERROR}}</p><button class="submit" id="submit-login" type="submit">Ingresar al mapa <span aria-hidden="true">→</span></button></form>
<p class="access"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2" stroke="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="currentColor"/></svg>Acceso autorizado</p></section><p class="footer">Estación de Policía El Espinal<br>Sistema de visualización de patrullaje</p></main></body></html>
